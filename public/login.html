<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuck of Amascut - Logg inn</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-logo">
    <img src="/img/logo.jpg" alt="Clan logo" class="osrs-logo">
    <h1 class="logo-title">Stuck of Amascut</h1>
    <p class="logo-subtitle">Clan-hub for gjengen</p>
  </div>

  <div class="login-card">
    <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
      <li class="nav-item">
        <button class="nav-link active" id="loginTabBtn" onclick="showTab('login')">Logg inn</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="registerTabBtn" onclick="showTab('register')">Registrer deg</button>
      </li>
    </ul>

    <div id="loginPanel">
      <div id="loginError" class="alert alert-danger d-none py-2"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Brukernavn</label>
          <input type="text" class="form-control" id="loginUsername" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label">Passord</label>
          <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-noob w-100">Logg inn</button>
      </form>
    </div>

    <div id="registerPanel" class="d-none">
      <p class="text-secondary" style="font-size:13px;">
        Skriv inn navnet på karakteren din nøyaktig som den heter i clanet.
        Vi sjekker automatisk om den finnes og om den allerede er tatt av
        noen andre - det finnes ingen nedtrekksliste, så ingen andre enn
        deg kan noensinne klaime karakteren din.
      </p>
      <div id="registerError" class="alert alert-danger d-none py-2"></div>
      <div id="registerSuccess" class="alert alert-success d-none py-2"></div>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Karakternavn</label>
          <input type="text" class="form-control" id="registerCharacter" placeholder="f.eks. Cryqt" required autocomplete="off">
          <div id="characterCheckMsg" class="form-text"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Brukernavn (for innlogging)</label>
          <input type="text" class="form-control" id="registerUsername" required minlength="3">
        </div>
        <div class="mb-3">
          <label class="form-label">Passord</label>
          <input type="password" class="form-control" id="registerPassword" required minlength="6">
          <div class="form-text">Minst 6 tegn.</div>
        </div>
        <button type="submit" class="btn btn-noob w-100">Registrer og bli medlem</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
