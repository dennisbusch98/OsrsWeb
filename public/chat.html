<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuck of Amascut - Chat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<style>
  .chat-log { max-height: 65vh; overflow-y: auto; display: flex; flex-direction: column-reverse; }
  .chat-line { padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; background: var(--bg-panel-2); font-size: 13.5px; }
  .chat-line b { color: var(--accent); }
  .chat-line .chat-time { color: var(--text-dim); font-size: 10.5px; margin-left: 6px; }
</style>
</head>
<body class="app-body">

<div id="navbarPlaceholder"></div>

<div class="container" style="max-width: 700px; padding-bottom: 60px;">
  <h4 class="font-rune mb-1" style="color:#ffb300;">💬 Clan Chat</h4>
  <p class="text-secondary" style="font-size:12px;">
    Live-feed fra Clan Chat-webhooken (se Settings for URL-en). Denne siden
    kan bare vise meldinger som kommer inn via webhooken - du kan ikke
    skrive tilbake herfra enda.
  </p>
  <div class="panel p-3">
    <div id="chatLog" class="chat-log">
      <p class="text-secondary">Laster chat...</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
