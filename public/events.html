<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuck of Amascut - Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbarPlaceholder"></div>

<div class="container" style="max-width: 800px; padding-bottom: 60px;">

  <div id="addEventToggle" class="add-event-toggle mb-4" onclick="showEventForm()">
    ➕ Legg til nytt event
  </div>

  <div class="panel p-3 mb-4 d-none" id="eventFormPanel">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="text-secondary mb-0">➕ Nytt event</h6>
      <button class="btn btn-sm btn-outline-light" onclick="hideEventForm()">Avbryt</button>
    </div>
    <div id="eventError" class="alert alert-danger d-none py-2"></div>
    <form id="eventForm" class="row g-2">
      <div class="col-12">
        <input type="text" class="form-control" id="eventTitle" placeholder="Tittel (f.eks. 'ToA trip med gutta')" required>
      </div>
      <div class="col-12">
        <textarea class="form-control" id="eventDescription" rows="2" placeholder="Beskrivelse (valgfritt)"></textarea>
      </div>
      <div class="col-8">
        <input type="datetime-local" class="form-control" id="eventDatetime" required>
      </div>
      <div class="col-4">
        <button type="submit" class="btn btn-noob w-100">Legg til</button>
      </div>
    </form>
  </div>

  <h5 class="font-rune mb-3" style="color:#ffb300;">Kommende events</h5>
  <div id="eventsList"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/events.js"></script>
</body>
</html>
