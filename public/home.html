<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuck of Amascut - Hjem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbarPlaceholder"></div>

<div class="container" style="max-width: 720px; padding-bottom: 60px;">

  <div class="panel p-3 mb-4">
    <h6 class="text-secondary mb-2">Skriv et innlegg</h6>
    <div id="postError" class="alert alert-danger d-none py-2"></div>
    <form id="postForm">
      <textarea class="form-control mb-2" id="postContent" rows="3" placeholder="Hva skjer i clanet? Flex litt loot, planlegg en trip, klag over dry streak..."></textarea>
      <div class="row g-2 align-items-center">
        <div class="col">
          <input type="url" class="form-control form-control-sm" id="postImageUrl" placeholder="Valgfritt: bilde-URL (screenshot av dropp osv.)">
        </div>
        <div class="col-auto form-check">
          <input class="form-check-input" type="checkbox" id="postAsCharacter">
          <label class="form-check-label" style="font-size:13px;">Post som min karakter</label>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-noob btn-sm">Post</button>
        </div>
      </div>
    </form>
  </div>

  <div id="feed"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
